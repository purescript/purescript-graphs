package:
  name: graphs
  description: A data structure and functions for graphs.
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 8.1.1
    license: MIT
    location:
      githubOwner: purescript
      githubRepo: purescript-graphs
  dependencies:
    - bifunctors: ">=6.0.0 <7.0.0"
    - catenable-lists: ">=7.0.0 <8.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - ordered-collections: ">=3.0.0 <4.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - console: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
workspace: {}
